# Initialisation ou mise à jour de la base de production, lancée à la main (onglet Actions).
# Sauvegarde d'abord, puis migrations, référentiels et compte administrateur s'il n'existe pas.
# Secrets : DATABASE_URL_DIRECT, BACKUP_PASSPHRASE, ADMIN_INITIAL_PASSWORD (utilisé une seule fois).
name: Base de données (initialiser / mettre à jour)
on:
  workflow_dispatch:
jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Client PostgreSQL 18
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
      - name: Sauvegarde avant modification
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: PATH="/usr/lib/postgresql/18/bin:$PATH" scripts/backup.sh backups
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-avant-maj-${{ github.run_id }}
          path: backups/*.dump.enc
          retention-days: 90
      - name: Migrations, référentiels, compte administrateur
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
        run: npm run db:setup
